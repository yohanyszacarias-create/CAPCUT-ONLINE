# Configuración para Fly.io
# Usar este archivo para desplegar en Fly.io

# Para API:
# fly launch --name videomaker-api --dockerfile infra/docker/Dockerfile.api

# Para Worker:
# fly launch --name videomaker-worker --dockerfile infra/docker/Dockerfile.worker

app = \"videomaker-api\"
primary_region = \"mad\" # Madrid, cambiar según necesidad

[build]
  dockerfile = \"infra/docker/Dockerfile.api\"

[env]
  NODE_ENV = \"production\"
  PORT = \"3000\"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true

[[services]]
  protocol = \"tcp\"
  internal_port = 3000
  processes = [\"app\"]

  [services.concurrency]
    type = \"connections\"
    hard_limit = 1000
    soft_limit = 800

  [[services.ports]]
    port = 80
    handlers = [\"http\"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = [\"tls\", \"http\"]

[checks]
  [checks.alive]
    type = \"http\"
    interval = \"10s\"
    timeout = \"5s\"
    grace_period = \"5s\"
    method = \"GET\"
    path = \"/health\"

[[vm]]
  memory = \"512mb\"
  cpus = 1

